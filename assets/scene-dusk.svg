<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dusk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0715"/>
      <stop offset=".36" stop-color="#23102e"/>
      <stop offset=".68" stop-color="#3b1128"/>
      <stop offset="1" stop-color="#09070d"/>
    </linearGradient>
    <linearGradient id="dusk-orange" x1="660" y1="1320" x2="1530" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c22f37" stop-opacity=".15"/>
      <stop offset=".32" stop-color="#ff6f4a"/>
      <stop offset=".64" stop-color="#ffb45d"/>
      <stop offset="1" stop-color="#ffd89f" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="dusk-violet" x1="-80" y1="180" x2="1320" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c7a7ff" stop-opacity=".25"/>
      <stop offset=".4" stop-color="#835fff"/>
      <stop offset=".76" stop-color="#4924b9" stop-opacity=".75"/>
      <stop offset="1" stop-color="#1a0b3e" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="dusk-rose" x1="150" y1="1150" x2="1240" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6e9d"/>
      <stop offset=".52" stop-color="#c93f8a"/>
      <stop offset="1" stop-color="#61286b" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="dusk-blue" x1="100" y1="1070" x2="1430" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b5cff" stop-opacity=".1"/>
      <stop offset=".46" stop-color="#283cb4" stop-opacity=".65"/>
      <stop offset="1" stop-color="#101b60" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="dusk-sun" cx=".74" cy=".34" r=".28">
      <stop offset="0" stop-color="#ffe7bc" stop-opacity=".85"/>
      <stop offset=".28" stop-color="#ffb76f" stop-opacity=".38"/>
      <stop offset=".7" stop-color="#ff6b68" stop-opacity=".1"/>
      <stop offset="1" stop-color="#23102e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dusk-caustic" x1="380" y1="980" x2="1360" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd1b0" stop-opacity="0"/>
      <stop offset=".36" stop-color="#ffe5ca" stop-opacity=".52"/>
      <stop offset=".7" stop-color="#ffb4c6" stop-opacity=".24"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dusk-vignette" cx=".5" cy=".46" r=".78">
      <stop offset=".48" stop-color="#07040a" stop-opacity="0"/>
      <stop offset=".8" stop-color="#07040a" stop-opacity=".26"/>
      <stop offset="1" stop-color="#07040a" stop-opacity=".78"/>
    </radialGradient>
    <filter id="dusk-blur-huge" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
    <filter id="dusk-blur-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="58"/>
    </filter>
    <filter id="dusk-blur-tight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="dusk-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="41" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .26"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#dusk-bg)"/>
  <rect width="1600" height="1200" fill="url(#dusk-sun)"/>

  <g filter="url(#dusk-blur-huge)">
    <path d="M-260 1120 C 80 810, 310 980, 580 740 S 980 330, 1400 500" fill="none" stroke="url(#dusk-violet)" stroke-width="460" stroke-linecap="round" opacity=".85"/>
    <path d="M440 1340 C 750 990, 940 1110, 1170 760 S 1510 420, 1860 370" fill="none" stroke="url(#dusk-orange)" stroke-width="370" stroke-linecap="round" opacity=".84"/>
    <path d="M-240 470 C 170 180, 470 430, 790 250 S 1260 190, 1690 40" fill="none" stroke="url(#dusk-rose)" stroke-width="330" stroke-linecap="round" opacity=".46"/>
    <path d="M-300 1180 C 250 980, 530 1210, 910 960 S 1410 760, 1810 890" fill="none" stroke="url(#dusk-blue)" stroke-width="330" stroke-linecap="round" opacity=".66"/>
    <ellipse cx="1150" cy="390" rx="440" ry="300" fill="#ff9b54" opacity=".12"/>
  </g>

  <g filter="url(#dusk-blur-soft)">
    <path d="M330 1170 C 650 956, 822 1018, 1050 790 S 1390 535, 1680 520" fill="none" stroke="#ffd9ab" stroke-width="64" stroke-linecap="round" opacity=".22"/>
    <path d="M-60 580 C 290 380, 490 560, 760 360" fill="none" stroke="#edb8ff" stroke-width="90" stroke-linecap="round" opacity=".18"/>
    <ellipse cx="1110" cy="330" rx="205" ry="145" fill="#ffe7c5" opacity=".28"/>
    <ellipse cx="520" cy="790" rx="260" ry="180" fill="#ff5e81" opacity=".13"/>
  </g>

  <g filter="url(#dusk-blur-tight)">
    <path d="M310 1056 C 606 886, 802 955, 1012 782 S 1338 585, 1590 580" fill="none" stroke="url(#dusk-caustic)" stroke-width="14" stroke-linecap="round" opacity=".8"/>
    <path d="M120 620 C 326 516, 504 590, 692 466" fill="none" stroke="#ffe6fa" stroke-width="5" stroke-linecap="round" opacity=".35"/>
    <path d="M942 424 C 1100 344, 1244 370, 1420 288" fill="none" stroke="#ffe0c6" stroke-width="7" stroke-linecap="round" opacity=".4"/>
    <ellipse cx="1152" cy="328" rx="42" ry="30" fill="#fff4db" opacity=".52"/>
  </g>

  <g fill="none" stroke="#ffdcd3" stroke-linecap="round" opacity=".3">
    <path d="M-20 940 C 300 812, 560 906, 808 744" stroke-width="1.2" opacity=".3"/>
    <path d="M560 1200 C 756 1040, 980 1081, 1200 897" stroke-width="1" opacity=".24"/>
  </g>

  <rect width="1600" height="1200" filter="url(#dusk-grain)" opacity=".42"/>
  <rect width="1600" height="1200" fill="url(#dusk-vignette)"/>
</svg>
