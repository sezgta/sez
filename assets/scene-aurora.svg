<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="aurora-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset=".38" stop-color="#082b42"/>
      <stop offset=".72" stop-color="#0a1a36"/>
      <stop offset="1" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="aurora-mint" x1="80" y1="980" x2="1420" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1de5bb"/>
      <stop offset=".38" stop-color="#57ffd9"/>
      <stop offset=".7" stop-color="#1478ff"/>
      <stop offset="1" stop-color="#112ab8" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="aurora-blue" x1="-40" y1="220" x2="1480" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#345dff" stop-opacity=".2"/>
      <stop offset=".38" stop-color="#2973ff"/>
      <stop offset=".78" stop-color="#61d7ff"/>
      <stop offset="1" stop-color="#b8fff2" stop-opacity=".1"/>
    </linearGradient>
    <linearGradient id="aurora-coral" x1="440" y1="1320" x2="1600" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5d3e" stop-opacity=".1"/>
      <stop offset=".34" stop-color="#ff8d68" stop-opacity=".7"/>
      <stop offset=".7" stop-color="#ffc08a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff8ecc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora-violet" x1="780" y1="0" x2="1670" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8b6ff" stop-opacity=".44"/>
      <stop offset=".5" stop-color="#8d62ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#341b8f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aurora-glow" cx=".72" cy=".22" r=".5">
      <stop offset="0" stop-color="#d7fff7" stop-opacity=".55"/>
      <stop offset=".3" stop-color="#6effd7" stop-opacity=".18"/>
      <stop offset=".7" stop-color="#2379ff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#06111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aurora-caustic" x1="280" y1="930" x2="1300" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b7fff0" stop-opacity="0"/>
      <stop offset=".3" stop-color="#ddfff8" stop-opacity=".5"/>
      <stop offset=".62" stop-color="#9ddcff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aurora-vignette" cx=".5" cy=".46" r=".78">
      <stop offset=".5" stop-color="#02050b" stop-opacity="0"/>
      <stop offset=".82" stop-color="#02050b" stop-opacity=".24"/>
      <stop offset="1" stop-color="#02050b" stop-opacity=".72"/>
    </radialGradient>
    <filter id="aurora-blur-huge" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="115"/>
    </filter>
    <filter id="aurora-blur-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="54"/>
    </filter>
    <filter id="aurora-blur-tight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="aurora-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".78" numOctaves="3" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .3"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#aurora-bg)"/>
  <rect width="1600" height="1200" fill="url(#aurora-glow)"/>

  <g filter="url(#aurora-blur-huge)">
    <path d="M-280 880 C 120 620, 390 1090, 760 790 S 1370 260, 1860 510" fill="none" stroke="url(#aurora-mint)" stroke-width="440" stroke-linecap="round" opacity=".82"/>
    <path d="M-300 300 C 180 60, 490 500, 900 290 S 1420 130, 1840 350" fill="none" stroke="url(#aurora-blue)" stroke-width="350" stroke-linecap="round" opacity=".7"/>
    <path d="M520 1390 C 730 1040, 980 1130, 1180 840 S 1540 570, 1860 650" fill="none" stroke="url(#aurora-coral)" stroke-width="310" stroke-linecap="round" opacity=".72"/>
    <ellipse cx="1390" cy="190" rx="380" ry="290" fill="url(#aurora-violet)" opacity=".72"/>
    <ellipse cx="250" cy="1080" rx="380" ry="300" fill="#0c3c5b" opacity=".6"/>
  </g>

  <g filter="url(#aurora-blur-soft)">
    <path d="M-80 836 C 280 640, 480 910, 780 708 S 1260 380, 1640 480" fill="none" stroke="#a4ffea" stroke-width="54" stroke-linecap="round" opacity=".25"/>
    <path d="M330 1320 C 590 990, 820 1020, 1010 790 S 1370 560, 1620 610" fill="none" stroke="#ffb397" stroke-width="95" stroke-linecap="round" opacity=".22"/>
    <ellipse cx="1190" cy="250" rx="180" ry="140" fill="#c9fff4" opacity=".24"/>
    <ellipse cx="870" cy="630" rx="240" ry="170" fill="#419cff" opacity=".18"/>
  </g>

  <g filter="url(#aurora-blur-tight)">
    <path d="M42 783 C 348 621, 546 823, 811 662 S 1200 410, 1538 467" fill="none" stroke="url(#aurora-caustic)" stroke-width="12" stroke-linecap="round" opacity=".8"/>
    <path d="M126 851 C 372 748, 594 898, 824 762" fill="none" stroke="#e8fffa" stroke-width="4" stroke-linecap="round" opacity=".38"/>
    <path d="M1110 349 C 1260 284, 1390 310, 1534 234" fill="none" stroke="#f2d9ff" stroke-width="7" stroke-linecap="round" opacity=".35"/>
    <path d="M610 1014 C 754 943, 872 951, 1002 876" fill="none" stroke="#ffd0b8" stroke-width="5" stroke-linecap="round" opacity=".35"/>
    <ellipse cx="1280" cy="205" rx="54" ry="38" fill="#ecfff9" opacity=".4"/>
  </g>

  <g opacity=".42" fill="none" stroke="#d8fff7" stroke-linecap="round">
    <path d="M-40 946 C 320 782, 620 886, 924 725" stroke-width="1.3" opacity=".4"/>
    <path d="M250 1112 C 518 936, 748 1032, 1018 846" stroke-width="1" opacity=".28"/>
    <path d="M1070 385 C 1260 295, 1450 348, 1650 220" stroke-width="1.2" opacity=".3"/>
  </g>

  <rect width="1600" height="1200" filter="url(#aurora-grain)" opacity=".44"/>
  <rect width="1600" height="1200" fill="url(#aurora-vignette)"/>
</svg>
